[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Telco Customer Churn MLOps Pipeline - Production-ready ML pipeline with experiment tracking, model registry, serving, and drift monitoring"
readme = "README.md"
authors = [
    { name = "kimdotpy", email = "kimdotpy@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "mlflow>=2.12",
    "evidently>=0.4.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "black>=23.0",
    "pre-commit>=3.6",
]

[project.scripts]
train = "src.train.train:main"
serve = "src.serve.app:main"
drift-check = "src.monitor.drift_check:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
